<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">Diário <span>com Cadeado</span></div><button class="btn ghost" id="inicio">Início</button></header>
<div class="card"><h1>Login</h1>
<label for="email">email</label><input id="email" type="email" autocomplete="email">
<label for="senha">senha</label><input id="senha" type="password" autocomplete="current-password">
<div class="err" id="err">preencha todos os campos</div>
<button class="btn" id="enviar">enviar</button>
<button class="btn ghost" id="signin">sign-in</button></div>
<script src="script.js"></script></body></html>
