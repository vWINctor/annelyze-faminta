<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Diário</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">Diário <span>com Cadeado</span></div><div class="user" id="user"></div></header>
<main><h1>Seu diário,<br>só seu.</h1><p class="lead">Um espaço privado para escrever notas diárias, escolher o humor do dia e guardar tudo com cadeado.</p><div class="moods"><span>😄</span><span>🙂</span><span>😐</span><span>😢</span><span>😡</span></div><div class="grid">
<button class="opt" data-o><b>✍️ Escrever nota</b><small>Registre o seu dia</small></button>
<button class="opt" data-o><b>😊 Humor do dia</b><small>Escolha um emoji</small></button>
<button class="opt" data-o><b>📖 Minhas notas</b><small>Releia o que salvou</small></button>
<button class="opt" data-o><b>🔒 Cadeado</b><small>Proteja seu diário</small></button>
</div></main>
<div class="toast" id="toast"><div>teste concluido</div></div>
<script src="script.js"></script></body></html>
